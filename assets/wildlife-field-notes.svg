      <stop offset="0" stop-color="#4d8073" stop-opacity=".42"/>
      <stop offset="1" stop-color="#102a24" stop-opacity=".2"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
