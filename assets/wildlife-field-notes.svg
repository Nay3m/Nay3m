<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Wildlife field notes</title>
  <desc id="desc">A warm field-note illustration with wetland water lines, reeds, flying birds, and an elephant silhouette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a24"/>
